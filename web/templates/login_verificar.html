{{define "login_verificar"}}
<div id="auth-panel">
    <div class="modal-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="login-pendiente-titulo">
            <h2 id="login-pendiente-titulo">Falta confirmar tu email</h2>
            <p style="color:var(--text-secondary)">
                Tu cuenta está registrada pero todavía no verificaste
                <strong>{{.Email}}</strong>. Te enviamos un enlace de confirmación;
                si no lo encontrás, reenvialo acá:
            </p>
            <form hx-post="/api/auth/reenviar-verificacion" hx-target="#auth-panel" hx-swap="outerHTML" method="post" action="/api/auth/reenviar-verificacion">
                <div class="form-group">
                    <label for="reenvio-email">Email</label>
                    <input type="email" id="reenvio-email" name="email" required value="{{.Email}}">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Reenviar email de verificación</button>
            </form>
            <div class="modal-actions">
                <a href="/login" class="btn btn-primary">Ya lo confirmé, iniciar sesión</a>
            </div>
        </div>
    </div>
</div>
{{end}}

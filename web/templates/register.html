{{define "head"}}
<link rel="stylesheet" href="/static/css/auth.css">
{{end}}
{{define "content"}}
<div class="auth-form">
    <h1 class="auth-logo"><img src="/images/logo_optipay.png" alt="Optipay"><a> Optipay</a></h1>
    <div class="card">
        <h2>Crear Cuenta</h2>
        <form hx-post="/api/auth/register" hx-swap="none" method="post" action="/api/auth/register">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                    <button type="button" class="password-toggle" aria-label="Mostrar contraseña" aria-pressed="false">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="moneda_default">Moneda</label>
                <select id="moneda_default" name="moneda_default">
                    <option value="ARS">ARS ($)</option>
                    <option value="USD">USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Crear Cuenta</button>
        </form>
        <p class="text-center mt-1">
            ¿Ya tenés cuenta? <a href="/login">Iniciar Sesión</a>
        </p>
    </div>
</div>
{{end}}

{{define "content"}}
<div class="auth-form">
    <h1>💰 Finanzas Personales</h1>
    <div class="card">
        <h2>Crear Cuenta</h2>
        <form hx-post="/api/auth/register" hx-swap="none" method="post" action="/api/auth/register">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="moneda_default">Moneda</label>
                <select id="moneda_default" name="moneda_default">
                    <option value="ARS">ARS ($)</option>
                    <option value="USD">USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Crear Cuenta</button>
        </form>
        <p class="text-center mt-1">
            ¿Ya tenés cuenta? <a href="/login">Iniciar Sesión</a>
        </p>
    </div>
</div>
{{end}}

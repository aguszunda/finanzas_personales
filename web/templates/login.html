{{define "head"}}
<link rel="stylesheet" href="/static/css/auth.css">
{{end}}
{{define "content"}}
<div class="auth-form">
    <h1 class="auth-logo"><img src="/images/logo_optipay.png" alt="Optipay"><a> Optipay</a></h1>
    {{if .pendienteVerificacion}}
        {{template "login_verificar" .}}
    {{else}}
    <div id="auth-panel">
    <div class="card">
        <h2 style="text-align:center">Iniciar Sesión</h2>
        <form hx-post="/api/auth/login" hx-target="#auth-panel" hx-swap="outerHTML" method="post" action="/api/auth/login">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <button type="button" class="password-toggle" aria-label="Mostrar contraseña" aria-pressed="false">
                        <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>
            <div style="display:flex;justify-content:center">
                <button type="submit" class="btn btn-primary" style="width:25%">Ingresar</button>
            </div>
        </form>
        <p class="text-center mt-1">
            <a href="/forgot-password" id="forgot-link">¿Olvidaste tu contraseña?</a>
        </p>
        <p class="text-center mt-1">
            ¿No tenés cuenta? <a href="/register">Registrate</a>
        </p>
    </div>
    </div>
    <script>
    (function(){
        var email = document.getElementById('email');
        var link = document.getElementById('forgot-link');
        if (email && link) {
            email.addEventListener('input', function() {
                var v = encodeURIComponent(this.value);
                link.href = '/forgot-password' + (v ? '?email=' + v : '');
            });
        }
    })();
    </script>
    {{end}}
</div>
{{end}}

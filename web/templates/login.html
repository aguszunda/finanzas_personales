{{define "head"}}
<link rel="stylesheet" href="/static/css/auth.css">
{{end}}
{{define "content"}}
<div class="auth-form">
    <h1>💰 Finanzas Personales</h1>
    <div class="card">
        <h2 style="text-align:center">Iniciar Sesión</h2>
        <form hx-post="/api/auth/login" hx-swap="none" method="post" action="/api/auth/login">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required
                       pattern="[a-zA-Z0-9.!#$%&'*+/=?^_\x60{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+"
                       title="Ingresá un email válido, ej: nombre@dominio.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div style="display:flex;justify-content:center">
                <button type="submit" class="btn btn-primary" style="width:25%">Ingresar</button>
            </div>
        </form>
        <p class="text-center mt-1">
            ¿No tenés cuenta? <a href="/register">Registrate</a>
        </p>
    </div>
</div>
{{end}}

{{define "head"}}
<link rel="stylesheet" href="/static/css/auth.css">
{{end}}
{{define "content"}}
<div class="auth-form">
    <h1 class="auth-logo"><img src="/images/logo_optipay.png" alt="Optipay"><a> Optipay</a></h1>
    <div id="auth-panel">
        <div class="card">
            <h2 style="text-align:center">Restablecer contraseña</h2>
            <form hx-post="/api/auth/reset-password" hx-target="#auth-panel" hx-swap="outerHTML" method="post" action="/api/auth/reset-password">
                <input type="hidden" name="token" value="{{.Token}}">
                <div class="form-group">
                    <label for="password">Nueva contraseña</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password">
                        <button type="button" class="password-toggle" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password2">Confirmar contraseña</label>
                    <div class="password-wrap">
                        <input type="password" id="password2" name="password2" required minlength="8" maxlength="72" autocomplete="new-password">
                        <button type="button" class="password-toggle" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="display:block;margin:1rem auto 0;padding:0.6rem 2rem">Guardar contraseña</button>
            </form>
            <p class="text-center mt-1">
                <a href="/login">Volver a iniciar sesión</a>
            </p>
        </div>
    </div>
</div>
{{end}}

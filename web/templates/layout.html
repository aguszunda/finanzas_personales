<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas Personales</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f8f9fa; --card: #ffffff; --text: #212529;
            --text-secondary: #6c757d; --border: #dee2e6;
            --primary: #0d6efd; --success: #198754; --danger: #dc3545;
            --warning: #ffc107; --info: #0dcaf0;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 0; margin-bottom: 2rem; }
        nav .container { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
        nav .brand { font-weight: 700; font-size: 1.25rem; color: var(--primary); text-decoration: none; }
        nav a { color: var(--text); text-decoration: none; padding: 0.5rem 0.75rem; border-radius: 6px; transition: background 0.2s; }
        nav a:hover { background: var(--bg); }
        .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; font-size: 0.875rem; text-decoration: none; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-primary:hover { opacity: 0.9; }
        .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
        .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
        .btn-outline { background: transparent; color: var(--text); }
        .btn-outline:hover { background: var(--bg); }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
        .stat { text-align: center; padding: 1.5rem; }
        .stat .value { font-size: 2rem; font-weight: 700; }
        .stat .label { color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.25rem; }
        .stat .positive { color: var(--success); }
        .stat .negative { color: var(--danger); }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); }
        th { font-weight: 600; color: var(--text-secondary); font-size: 0.875rem; }
        .badge { display: inline-flex; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .badge-ingreso { background: #d1e7dd; color: #0f5132; }
        .badge-egreso { background: #f8d7da; color: #842029; }
        .badge-deuda { background: #cfe2ff; color: #084298; }
        .badge-pendiente { background: #fff3cd; color: #664d03; }
        .badge-pagada { background: #d1e7dd; color: #0f5132; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.375rem; font-weight: 500; font-size: 0.875rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.875rem; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: var(--card); border-radius: 12px; padding: 2rem; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal h2 { margin-bottom: 1rem; }
        .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }
        .auth-form { max-width: 400px; margin: 4rem auto; }
        .auth-form h1 { text-align: center; margin-bottom: 2rem; }
        .alert { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
        .alert-error { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
        .loading { opacity: 0.6; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .mt-1 { margin-top: 1rem; }
        .mb-1 { margin-bottom: 1rem; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
        @media print {
            nav, .no-print { display: none !important; }
            body { background: #fff; }
            .card { border: none; box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body hx-boost="true">
    <nav id="main-nav">
        <div class="container">
            <a href="/api/dashboard/page" class="brand">💰 Finanzas</a>
            <a href="/api/dashboard/page">Balance General</a>
            <a href="/api/transacciones/page">Transacciones</a>
            <a href="/api/costos-fijos/page">Costos Fijos</a>
            <a href="/api/deudas/page">Deudas</a>
            <a href="/api/balance/page">Balance</a>
            <a href="/api/meses/page">Meses</a>
        </div>
    </nav>
    <main class="container" id="main-content">
        {{block "content" .}}{{end}}
    </main>
    <script>
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            var target = evt.detail.target;
            if (target) target.classList.add('loading');
        });
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            var target = evt.detail.target;
            if (target) target.classList.remove('loading');
        });
        document.body.addEventListener('htmx:responseError', function(evt) {
            var text = evt.detail.xhr.responseText || 'Error del servidor';
            try { text = JSON.parse(text).error || text; } catch(e) {}
            alert('Error: ' + text);
        });
    </script>
</body>
</html>

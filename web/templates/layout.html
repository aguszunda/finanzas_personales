<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optipay</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/print.css" media="print">
    {{block "head" .}}{{end}}
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/static/js/form-validation.js" defer></script>
</head>
<body hx-boost="true"{{if not .hideNav}} class="nav-active"{{end}}>
    {{if not .hideNav}}
    <aside class="sidebar">
        <a href="/api/dashboard/page" class="brand"><img src="/images/logo_optipay.png" alt="Optipay"><span class="sidebar-label">Optipay</span></a>
        <nav class="sidebar-nav">
            <a href="/api/dashboard/page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="sidebar-label">Inicio</span></a>
            <a href="/api/transacciones/page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span class="sidebar-label">Transacciones</span></a>
            <a href="/api/balance/page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span class="sidebar-label">Balance</span></a>
            <a href="/api/meses/page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="sidebar-label">Meses</span></a>
        </nav>
    </aside>
    <header class="topbar" style="background:none;border:none;">
        <div class="nav-user">
            <button class="nav-user-btn" onclick="this.parentElement.classList.toggle('open')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>{{.userName}}</span>
            </button>
            <div class="nav-user-dropdown">
                <a href="/api/profile/page">Actualizar perfil</a>
                <a href="/api/auth/logout" hx-boost="false">Cerrar sesión</a>
            </div>
        </div>
    </header>
    {{end}}
    <main class="container" id="main-content">
        {{block "content" .}}{{end}}
    </main>
    <script>
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            var target = evt.detail.target;
            if (target) target.classList.add('loading');
        });
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            var target = evt.detail.target;
            if (target) target.classList.remove('loading');
        });
        document.body.addEventListener('htmx:responseError', function(evt) {
            var xhr = evt.detail.xhr;
            var text = xhr.responseText || 'Error del servidor';
            try { text = JSON.parse(text).error || text; } catch(e) {}
            var action = null;
            var path = (evt.detail.pathInfo && evt.detail.pathInfo.requestPath) || '';
            if (path.indexOf('/login') !== -1 && xhr.status === 404) {
                action = { href: '/register', label: 'Registrate' };
            } else if (path.indexOf('/login') !== -1 && xhr.status === 401) {
                var pw = document.getElementById('password');
                if (pw) pw.value = '';
            } else if (path.indexOf('/profile/password') !== -1) {
                var pwActual = document.getElementById('password_actual');
                var pw2 = document.getElementById('password2');
                if (pwActual) pwActual.value = '';
                if (pw2) pw2.value = '';
            }
            showAlertModal(text, 'error', action);
        });
        function showAlertModal(message, type, action) {
            type = type || 'error';
            var modal = document.getElementById('alert-modal');
            if (!modal) return;
            ['error', 'success', 'warning', 'info'].forEach(function(v) {
                modal.classList.remove('modal-' + v);
            });
            modal.classList.add('modal-' + type);
            var titles = { error: 'Error', success: 'Listo', warning: 'Atención', info: 'Información' };
            var icons = { error: '❌', success: '✅', warning: '⚠️', info: 'ℹ️' };
            document.getElementById('alert-modal-title').textContent =
                (icons[type] || '') + ' ' + (titles[type] || 'Error');
            document.getElementById('alert-modal-message').textContent = message;
            var actionWrap = document.getElementById('alert-modal-action-wrap');
            var actionLink = document.getElementById('alert-modal-action');
            if (action) {
                actionLink.href = action.href;
                actionLink.textContent = action.label;
                actionWrap.style.display = '';
            } else {
                actionLink.removeAttribute('href');
                actionWrap.style.display = 'none';
            }
            modal.style.display = 'flex';
            document.getElementById('alert-modal-close').focus();
        }
        function closeAlertModal() {
            var modal = document.getElementById('alert-modal');
            if (modal) modal.style.display = 'none';
        }
        document.addEventListener('keydown', function(evt) {
            if (evt.key === 'Escape') closeAlertModal();
        });
        document.addEventListener('click', function(evt) {
            var btn = evt.target.closest ? evt.target.closest('.password-toggle') : null;
            if (!btn) return;
            var wrap = btn.closest('.password-wrap');
            var input = wrap && wrap.querySelector('input');
            if (!input) return;
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            // Los íconos son SVGElement: la propiedad .hidden no existe ahí,
            // hay que manipular el atributo (oculto vía css svg[hidden]).
            var eye = btn.querySelector('.icon-eye');
            var eyeOff = btn.querySelector('.icon-eye-off');
            if (show) {
                eye.setAttribute('hidden', '');
                eyeOff.removeAttribute('hidden');
            } else {
                eye.removeAttribute('hidden');
                eyeOff.setAttribute('hidden', '');
            }
            btn.setAttribute('aria-pressed', String(show));
            btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
        });
        document.addEventListener('click', function(evt) {
            var userNav = evt.target.closest ? evt.target.closest('.nav-user') : null;
            if (!userNav) {
                document.querySelectorAll('.nav-user.open').forEach(function(el) {
                    el.classList.remove('open');
                });
            }
        });
        ;(function() {
            var name = document.querySelector('.nav-user-btn span');
            if (name) name.textContent = name.textContent.toUpperCase();
        })();
    </script>
    <div id="alert-modal" class="modal-overlay" style="display:none"
         onclick="if(event.target===this)this.style.display='none'">
        <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="alert-modal-title">
            <h2 id="alert-modal-title"></h2>
            <p id="alert-modal-message" style="margin-bottom:1rem;color:var(--text-secondary)"></p>
            <p id="alert-modal-action-wrap" style="margin-bottom:1rem;display:none">
                <a id="alert-modal-action" href="/register"></a>
            </p>
            <div class="modal-actions">
                <button type="button" class="btn btn-primary" id="alert-modal-close" onclick="closeAlertModal()">Entendido</button>
            </div>
        </div>
    </div>
</body>
</html>

# Docker Compose para el entorno de desarrollo de optipay.
#
# Levanta los servicios que necesita la app:
#   - db:      MySQL 8.4 LTS con la base `finanzas` (utf8mb4 / utf8mb4_unicode_ci)
#   - migrate: aplica migrations/*.up.sql con golang-migrate (corre una vez)
#   - app:     el binario Go compilado desde el Dockerfile
#
# La app NO migra al arrancar: main.go no contiene SQL. `migrate` se encarga
# de dejar el esquema listo y la app arranca solo cuando terminó.
#
# Uso:
#   docker compose up -d --build   # construir y levantar
#   docker compose logs -f app     # logs en vivo
#   docker compose down            # detener (conserva el volumen de la base)
#   docker compose down -v         # detener y borrar datos de la base
#
# Variables configurables desde env.secrets (gitignored, no en el repo).
# Se cargan con `docker compose --env-file env.secrets ...` (ver Makefile):
#   MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD,
#   PORT, JWT_SECRET, JWT_EXPIRATION_HOURS, CORS_ORIGIN, LOG_LEVEL.
# JWT_SECRET es obligatorio (sin default): sin él la app no arranca.
# Los `:-default` inline son solo fallbacks de dev para que funcione sin archivo.

name: finanzas

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finanzas}
      MYSQL_USER: ${MYSQL_USER:-finanzas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-finanzas}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-finanzas-root}
    command:
      # La base creada por MYSQL_DATABASE hereda el collation del server.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Puerto publicado en el host para conectarse desde Workbench/cliente
    # (la app lo alcanza igual por la red interna de compose).
    # 3307 porque el 3306 del host lo usa el MySQL local (make run).
    ports:
      - "127.0.0.1:3307:3306"

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=mysql://${MYSQL_USER:-finanzas}:${MYSQL_PASSWORD:-finanzas}@tcp(db:3306)/${MYSQL_DATABASE:-finanzas}?parseTime=true&multiStatements=true&charset=utf8mb4&loc=Local"
      - "up"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: '${MYSQL_USER:-finanzas}:${MYSQL_PASSWORD:-finanzas}@tcp(db:3306)/${MYSQL_DATABASE:-finanzas}?parseTime=true&multiStatements=true&charset=utf8mb4&loc=Local'
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe estar definido en env.secrets}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-72}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s

volumes:
  db_data:

networks:
  default:
    driver: bridge
